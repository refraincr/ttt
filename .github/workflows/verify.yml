name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend compile and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  frontend-build:
    name: Frontend types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npx vite build

  behavior-tests:
    name: HTTP, MySQL and browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/verify.mjs --behavior-only
      - name: Upload service logs and Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-test-evidence
          include-hidden-files: true
          path: |
            .local/verification/
            frontend/test-results/
            frontend/playwright-report/
